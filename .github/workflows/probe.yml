name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://data.economie.gouv.fr/api/datasets/1.0/fichiers-des-locaux-et-des-parcelles-des-personnes-morales/attachments/fichiers_des_locaux_situation_2026zip
          curl -sSL -o l.zip "$U"; ls -la l.zip; unzip -l l.zip | head -30
          unzip -o -q l.zip; find . -iname "*75*" | head; 
          f=$(find . -iname "*75*" -type f | head -1); echo "FILE $f"; file "$f"
          if echo "$f" | grep -qi zip; then unzip -o -q "$f"; f=$(find . -iname "*75*" -type f ! -iname "*.zip" | head -1); fi
          echo "FILE2 $f"; head -c 1500 "$f" | iconv -f latin1 -t utf8; echo; wc -l "$f"
          grep -i "LAFFITTE" "$f" | head -5 | iconv -f latin1 -t utf8
