name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://data.economie.gouv.fr/api/datasets/1.0/fichiers-des-locaux-et-des-parcelles-des-personnes-morales/" | python3 -c "
          import sys,json;d=json.load(sys.stdin)
          for a in d.get('attachments',[]): print('ATT',a.get('id'),'|',a.get('title'))"
          curl -s "https://www.data.gouv.fr/api/1/datasets/fichiers-des-locaux-et-des-parcelles-des-personnes-morales/" | python3 -c "
          import sys,json;d=json.load(sys.stdin)
          for r in d['resources']: print('RES',r['title'],'|',r.get('filesize'),'|',r['url'])"
