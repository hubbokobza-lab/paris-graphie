name: Mise à jour des données

on:
  schedule:
    - cron: '17 4 * * 1'          # chaque lundi vers 5 h (heure de Paris) : urbanisme et CVP
    - cron: '43 2 3 1,4,7,10 *'   # le 3 janvier, avril, juillet, octobre : reconstruction complète
  push:                           # interface modifiée : nouvelle page seulement, données inchangées
    branches: [main]
    paths: ['static/**', 'pipeline/step_site.py', 'pipeline/methodes.py']
  workflow_dispatch:
    inputs:
      mode:
        description: 'weekly (étapes dues), full (tout reconstruire) ou site (page seulement)'
        type: choice
        options: [weekly, full, site]
        default: weekly

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer le site actuellement publié
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch --depth 1 origin gh-pages
            git worktree add ../site_actuel FETCH_HEAD
          else
            echo "Pas encore de branche gh-pages : première reconstruction complète."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Calcul
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "${{ github.event.schedule }}" = "43 2 3 1,4,7,10 *" ]; then MODE=full; fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE=site; fi
          echo "Mode : $MODE"
          python pipeline/run.py "$MODE" --site ../site_actuel --out ../site_neuf

      - name: Navigateur de contrôle
        run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Contrôle du site avant publication
        run: python pipeline/smoke.py ../site_neuf

      - name: Accès pour les IA (api/ et llms.txt)
        continue-on-error: true
        run: |
          python pipeline/step_api.py ../site_neuf || { echo "::warning title=Accès IA non mis à jour::reprise de la version précédente"; [ -d ../site_actuel/api ] && cp -r ../site_actuel/api ../site_neuf/ && cp ../site_actuel/llms.txt ../site_neuf/ || true; }

      - name: Publication sur la branche gh-pages
        run: |
          cd ../site_neuf
          git init -q -b gh-pages
          git config user.name "paris-graphie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Données du $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
